<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Request-time inference flow</title>
<desc>A prediction request passes schema validation, then splits into an ECG path and an optional text path. Both converge on the FP32 ONNX graph before softmax probabilities are returned.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="780" fill="#FFFFFF"/>

<line x1="340" y1="84" x2="340" y2="124" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="168" x2="135" y2="210" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="168" x2="445" y2="225" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="135" y1="254" x2="220" y2="520" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="355" y1="270" x2="340" y2="380" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="535" y1="270" x2="540" y2="380" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="436" x2="300" y2="520" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="540" y1="436" x2="420" y2="520" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="576" x2="340" y2="616" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="660" x2="340" y2="700" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="332" y="325" text-anchor="end" font-size="12" font-weight="600" fill="#334155">Yes</text>
<text x="550" y="325" text-anchor="start" font-size="12" font-weight="600" fill="#334155">No</text>

<rect x="190" y="40" width="300" height="44" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">POST /predict</text>

<rect x="190" y="124" width="300" height="44" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Schema validation</text>

<rect x="50" y="210" width="170" height="44" rx="8" fill="#0F766E" stroke="#115E59" stroke-width="1"/>
<text x="135" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Normalize ECG</text>

<polygon points="445,225 535,270 445,315 355,270" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="445" y="270" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Text present?</text>

<rect x="235" y="380" width="210" height="56" rx="8" fill="#9A3412" stroke="#7C2D12" stroke-width="1"/>
<text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Encode report text</text>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#FFF7ED">GerMedBERT + LoRA + projection</text>

<rect x="450" y="380" width="180" height="56" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="540" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Zero placeholder</text>
<text x="540" y="418" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#334155">Text absent</text>

<rect x="170" y="520" width="340" height="56" rx="8" fill="#5B21B6" stroke="#4C1D95" stroke-width="1"/>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">ONNX Runtime FP32</text>
<text x="340" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F5F3FF">Signal encoder + fusion + classifier</text>

<rect x="190" y="616" width="300" height="44" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="340" y="638" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Softmax probabilities</text>

<rect x="190" y="700" width="300" height="44" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
<text x="340" y="722" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Prediction response</text>
</svg>
