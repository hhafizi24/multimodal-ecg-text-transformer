<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title>Offline training and model selection pipeline</title>
<desc>PTB-XL ECG waveforms and reports pass through preprocessing and separate signal and text encoders. Cached embeddings feed cross-attention fusion and classification, while MLflow tracks experiments alongside the training flow.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="680" fill="#FFFFFF"/>

<line x1="340" y1="96" x2="340" y2="136" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="185" y2="232" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="495" y2="232" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="185" y1="288" x2="340" y2="328" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="495" y1="288" x2="340" y2="328" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="384" x2="340" y2="424" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="480" x2="340" y2="520" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="564" x2="340" y2="584" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="490" y1="452" x2="500" y2="452" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect x="190" y="40" width="300" height="56" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">PTB-XL</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">ECG + reports</text>

<rect x="140" y="136" width="400" height="56" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Preprocessing</text>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">Labels, folds, filtering, normalization</text>

<rect x="50" y="232" width="270" height="56" rx="8" fill="#0F766E" stroke="#115E59" stroke-width="1"/>
<text x="185" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Stage A</text>
<text x="185" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F0FDFA">1D CNN + Transformer</text>

<rect x="360" y="232" width="270" height="56" rx="8" fill="#9A3412" stroke="#7C2D12" stroke-width="1"/>
<text x="495" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Stage B</text>
<text x="495" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#FFF7ED">GerMedBERT + LoRA</text>

<rect x="140" y="328" width="400" height="56" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Cached embeddings</text>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#334155">256 dimensions per branch</text>

<rect x="190" y="424" width="300" height="56" rx="8" fill="#5B21B6" stroke="#4C1D95" stroke-width="1"/>
<text x="340" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Stage C</text>
<text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F5F3FF">Embedding-level cross-attention</text>

<rect x="190" y="520" width="300" height="44" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
<text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0F172A">Classifier</text>

<rect x="190" y="584" width="300" height="44" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
<text x="340" y="606" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Selected checkpoint</text>

<rect x="500" y="424" width="150" height="56" rx="8" fill="#334155" stroke="#1E293B" stroke-width="1"/>
<text x="575" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">MLflow</text>
<text x="575" y="462" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#E2E8F0">All-stage tracking</text>
</svg>
